apiVersion: v1
kind: Service

metadata:
  name: { { include "mlops-api-chart.fullname" . } }
  labels: { { - include "mlops-api-chart.labels" . | nindent 4 } }

spec:
  type: { { .Values.service.type } }

  selector: { { - include "mlops-api-chart.selectorLabels" . | nindent 4 } }

  ports:
    - name: http
      port: { { .Values.service.port } }
      targetPort: http
      protocol: TCP
